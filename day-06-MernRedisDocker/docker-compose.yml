version: "3.6"
name: DockerRedisAuth

services:
  mongo:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db  # Added space and internal slash
    networks:
      - DockerRedisAuth
  
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - DockerRedisAuth
    ports: # Changed from port
      - "9090:9090"
    depends_on:
      - mongo
    # The command here will override the CMD in your Dockerfile
    command: ["npm", "run", "dev"]

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - DockerRedisAuth
    ports: # Changed from port
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host"] # Added --host for Vite
    depends_on:
      - backend

volumes:
  mongo_data: # Matches the name used in the mongo service

networks:
  DockerRedisAuth:
    driver: bridge
